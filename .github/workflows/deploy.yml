name: 解压 zip → 发布网页 + 打包 APK

# 用法：把游戏 zip 上传到仓库根目录（main 分支）
#   1) 自动解压并覆盖上一版文件（只删上次解压出来的文件，不动你的 README 等）
#   2) 自动发布到 GitHub Pages（网页版）
#   3) 自动打包 Android APK（debug 版，可直接安装测试）
# APK 下载：仓库右侧 Releases → "最新测试 APK"，或 Actions 运行页底部 Artifacts
on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:        # 也可在 Actions 页面手动 Run workflow（用当前文件重新发布 + 打包）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 解压 zip（覆盖上一版）
        run: python3 .github/scripts/unpack.py
      - name: 提交解压后的文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化"
          else
            git commit -m "自动解压 zip 并更新游戏文件 [skip ci]"
            git push
          fi

  pages:
    needs: unpack
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: 整理发布目录
        run: |
          mkdir _site
          while IFS= read -r f; do
            [ -n "$f" ] && mkdir -p "_site/$(dirname "$f")" && cp "$f" "_site/$f"
          done < .deployed-manifest.txt
          test -f _site/index.html || { echo "没有 index.html，请先上传游戏 zip"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  apk:
    needs: unpack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 准备网页文件
        run: |
          mkdir www
          while IFS= read -r f; do
            [ -n "$f" ] && mkdir -p "www/$(dirname "$f")" && cp "$f" "www/$f"
          done < .deployed-manifest.txt
          test -f www/index.html || { echo "没有 index.html"; exit 1; }

      - name: 创建 Capacitor Android 工程
        run: |
          mkdir /tmp/app && cd /tmp/app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cp -r "$GITHUB_WORKSPACE/www" ./www
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.starplaza.game",
            "appName": "星光广场",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "backgroundColor": "#120e2b"
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: 设置横屏 + 全屏
        working-directory: /tmp/app/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$M"
          S=app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowActionBar">false</item>#<item name="windowActionBar">false</item><item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>#' "$S"
          grep -n "screenOrientation" "$M" || { echo "横屏设置失败"; exit 1; }

      - name: 编译 debug APK
        working-directory: /tmp/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: 整理 APK
        run: |
          mkdir out
          cp /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk out/StarPlaza-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: StarPlaza-debug-apk
          path: out/StarPlaza-debug.apk

      - name: 发布到 Releases（手机上直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk out/StarPlaza-debug.apk \
            --title "最新测试 APK" \
            --notes "由 Actions 自动打包的 debug 版（提交 ${GITHUB_SHA::7}）。手机下载后安装，需允许「安装未知来源应用」。"
